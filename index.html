<!DOCTYPE html>

  <title>Birthday Surprise</title>
  <style>
    * {

      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
         background: radial-gradient(circle at 20% 20%, #fbcfe8 0%, transparent 40%),
              radial-gradient(circle at 80% 80%, #fed7aa 0%, transparent 40%),
              radial-gradient(circle at 50% 50%, #e9d5ff 0%, #fae8ff 100%) !important;
         background-attachment: fixed;
         color: #1e293b;
         display: flex;
         justify-content: center;
         align-items: center;
         min-height: 100vh;
         margin: 0;
         padding: 20px;
          }
    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
    }
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background-color: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      text-decoration: none;
      color: #334155;
      font-weight: 600;
      font-size: 15px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }
    .link-card:hover {
      background-color: #e2e8f0;
      border-color: #cbd5e1;
      color: #0f172a;
    }
    .arrow {
      color: #94a3b8;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="links-list">

</body>
</html>
