<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <meta name="viewport"content="width=device-width,
initial-scale=1.0">
 <title>Happy Birthday Bestie!✨</title>

 <!--Cute Google Font (Caveat & Inter)-->
 <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wgth@400;600;700&display=swap" rel="stylesheet">

<style>
 /*1.Page Background */
 body{
  margin:0;
  padding:20px;
  min-heigth:100vh;
  background:linear-gradient(135deg, #ffeef2 0%, #fff8eb 50%, #eef5ff 100%);
  font-family:'Inter',sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  box-sizing:border-box;
}

/*2. The Floating Phone/Card Container*/
.card{
 background:rgba(255,255,255,0.9);
 border-radius:28px;
 padding:30px 24px;
 max-width:360px;
 width:100%;
 text-align:center;
 box-shadow:0 20px 40px rgba(230,160,180,0.25);
 border:1px solid rgba(255,255,255,0.8);
}

/*3. The Circular Bestie Photo*/
.bday-photo{
 width:110px;
 height:110px;
 border-radius:50%;
 object-fit:cover;
 border:4px solid #ffccd5;
 box-shadow:0 8px 16px rgba(255,182,193,0.4);
}

/*4. Handwriting Style Heading*/
h1{
 font-family:'Caveat',cursive;
 font-size:36px;
 color:#e63946;
 margin-bottom:5px;
}

.tagline{
 font-size:13px;
 color:#7d8597;
 margin-bottom:20px;
}

/*5.Candle Area*/
.cake-area{
 background:#fff0f3;
 padding:12px;
 border-radius:16px;
 margin-bottom:18px;
 cursor:pointer;
 user-select:none;
}
.flame{
 font-size:24px;
 display:inline-block;
 transition:all 0.4s ease;
}
.candle{
 font-size:28px;
 margin-top:-6px;
}
.cake-hint{
 font-size:11px;
 color:#e63946;
 font-weight:600;
 margin:4px 0 0 0;
}

/*6. Heartfelt Letter Box*/
.note-box{
 background:#fffaf0;
 border:1px dashed #ffd166;
 border-radius:16px;
 padding:14px;
 text-align:left;
 font-size:13px;
 line-height:1.5;
 color:#4a4e69;
 margin-bottom:20px;
}

/*7. Action Button*/
.button{
 background:linear-gradient(90deg,#ff758c 0%,#ff7eb3 100%);
 color:white;
 border:none;
 padding:14px 20px;
 font-size:14px;
 font-weight:700;
 border-radius:16px;
 cursor:pointer;
 width:100%;
 box-shadow:0 10px 20px rgba(255,177,140,0.35);
 transition:transform 0.2s,box-shadow 0.2s;
}
button:hover{
 transform:translateY(-2px);
 box-shadow:0 14px 24px rgba(255,117,140,0.45);
}button:active{
 transform:scale(0.98);
}
</style>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">
</script>
</head>
<body>

<!--The Birthday Card Container -->
<div class="card">

<!--Photo of your best friend-->
<img
src="C:\Users\Vikram\Desktop\Birthday Website\HD-wallpaper-funny-monkey-face-expression-orangutan-chimpanzee-ape-funny-monkey.jpg" alt="Best Friend"
class="bday-photo">

<h1 id="bday-title">Happy Birthday, Apurva!🎂</h1>
<p class="tagline">May God bless you with immense happiness, knowledge and prosperity🧿🤞🏻</p>

<!--Interactive Candle SVG Graphic -->
<div class="cake-area"onclick="blowCandle()">
 <div id="flame" class="flame">🔥</div>
 <div class="candle">🕯️</div>
 <p class="cake-hint">Tap the flame to blow out your candle!</p>
</div>

<!--Letter Note-->
<div class="note-box">
 <p>Thank you for supporting and motivating me everytime and being my Best Friend.</p>
 <p>Here is to another year of laughs, memories, and big dreams!❣️</p>
</div>
<!--Surprise Action Button -->
<button id="surprise-btn" onclick="celebrate()"> Tap for your Birthday Gift! 🎁</button>

</div>
<!--JavaScript(The Logic)-->
<script>
 //1.Function to blow out the candle
 let candleBlown=false;

 function blowCandle(){
  const flame= document.getElementById('flame');
  const hint= document.querySelector('.cake-hint');

  if(!candleBlown){
   //Extinguish the flame
   flame.style.opacity='0';
   flame.style.transform= 'scale(0.2)';
   hint.textContent="✨May you become as successful as you want. And may we get chance to meet and have some pictures and fun together!🧿😅";
   hint.style.color="#2a9d8f";
   candleBlown = true;

   //Fire gentle sparkles
   confetti({
    particleCount:50,
    spread:60,
    origin:{y:0.6}
   });
  }else{
   //Tap again to relight
   flame.style.opacity='1';
   flame.style.transform='scale(1)';
   hint.textContent="Tap the flame to blow out candle!";
   hint.style.color="#e63946";
   candleBlown = false;
  }
 }

//2. Function for the grand celebration button
function celebrate(){
 //Big Blast of colorful confetti!
 confetti({
  particleCount:150,
  spread:100,
  origin:{y:0.6}
  });
  //Change button text
  const btn= document.getElementById('surprise-btn');
  btn.innerText="Happiest Birthday My Bestest Friend❤️.May our Friendship continues forever🤞🏻🧿!!!";
  btn.style.background="linear-gradient(90deg, #48cae4 0%, #0096c7 100%)";
  }
 </script>
</body>
</html>
